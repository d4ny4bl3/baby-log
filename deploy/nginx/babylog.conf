# Vhost pro baby-log. Na server patří do /etc/nginx/sites-available/babylog.conf
# a symlinkem do sites-enabled/.
#
# Zdrojem je doslovná kopie živého configu z repa phantom-server (snímek 2026-09-09).
# Doplněné jsou jen dva bloky pro health: `limit_req_zone` níž a `location = /api/health/`.
#
# Deploy skript nginx nenasazuje, dělá se ručně:
#     sudo cp deploy/nginx/babylog.conf /etc/nginx/sites-available/
#     sudo nginx -t && sudo systemctl reload nginx

# Jméno zóny musí být unikátní v rámci celého nginxu — na stejném stroji běží
# epubly (`epubly_health`) a inventory (`inventory_health`). Dvě zóny stejného
# jména nginx nenastartuje a shodí tím všechny weby.
limit_req_zone $binary_remote_addr zone=babylog_health:1m rate=20r/m;

server {
    listen 80;
    server_name babylog.cz;

    location /.well-known/acme-challenge/ {
        root /home/kuba/nginx/www;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name babylog.cz;
    server_tokens off;

    ssl_certificate     /etc/letsencrypt/live/babylog.cz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/babylog.cz/privkey.pem;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;

    client_max_body_size 5m;

    location /static/ {
        alias /home/kuba/nginx/www/babylog-static/;
        expires 30d;
    }

    location = /api/health/ {
        limit_req zone=babylog_health burst=10 nodelay;
        # Default nginxu je 503 — přesně kód, kterým health hlásí rozbitou appku.
        limit_req_status 429;

        proxy_pass http://127.0.0.1:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 10s;
        access_log off;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /admin/ {
        proxy_pass http://127.0.0.1:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
	return 444;
    }
}
